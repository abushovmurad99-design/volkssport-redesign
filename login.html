<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daxil ol / Qeydiyyat — VOLKS SPORT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=20261022">
<link rel="stylesheet" href="css/base.css?v=20261022">
<link rel="stylesheet" href="css/components.css?v=20261022">
<link rel="stylesheet" href="css/layout.css?v=20261022">
<link rel="stylesheet" href="css/pages.css?v=20261022">
</head>
<body data-page="auth">
<div data-include="partials/header.html"></div>
<!-- PrestaShop: blog module listing. Posts come from data/blog.json -->
<!-- PrestaShop: customer/authentication.tpl + customer/registration.tpl. UI only — submission is handled by PrestaShop AuthController. No credentials are stored in this build. -->
<main class="vs-container">
  <div class="vs-pagehead"><ol class="vs-breadcrumb"><li><a href="index.html">Ana səhifə</a></li><li><span aria-current="page">Hesab</span></li></ol></div>
  <div class="vs-auth">
    <section class="vs-auth__col" aria-labelledby="login-h">
      <h1 class="vs-h2" id="login-h">Daxil ol</h1>
      <form class="vs-auth__form" data-auth="login" novalidate>
        <div class="vs-field"><label for="login-email">E-poçt</label><input class="vs-input" id="login-email" name="login-email" type="email" autocomplete="email" required ><span class="vs-field__msg" data-msg></span></div>
        <div class="vs-field"><label for="login-pass">Şifrə</label><input class="vs-input" id="login-pass" name="login-pass" type="password" autocomplete="current-password" required minlength="5"><span class="vs-field__msg" data-msg></span></div>
        <label class="vs-check"><input type="checkbox" name="keep">Məni yadda saxla</label>
        <button class="vs-auth__link" type="button" data-forgot style="background:none;border:0;padding:0;text-decoration:underline;cursor:pointer">Şifrəni unutmusunuz?</button>
        <button class="vs-btn vs-btn--primary vs-btn--lg vs-btn--block" type="submit">Daxil ol</button>
        <div class="vs-alert" data-auth-msg hidden role="status"></div>
      </form>
      <form class="vs-auth__form" data-auth="forgot" novalidate hidden>
        <p class="vs-muted">Qeydiyyatdan keçdiyiniz e-poçtu və yeni şifrəni yazın.</p>
        <div class="vs-field"><label for="fg-email">E-poçt</label><input class="vs-input" id="fg-email" name="fg-email" type="email" autocomplete="email" required><span class="vs-field__msg" data-msg></span></div>
        <div class="vs-field"><label for="fg-pass">Yeni şifrə</label><input class="vs-input" id="fg-pass" name="fg-pass" type="password" autocomplete="new-password" minlength="8" required><span class="vs-field__msg" data-msg></span></div>
        <button class="vs-btn vs-btn--primary vs-btn--lg vs-btn--block" type="submit">Şifrəni yenilə</button>
        <button class="vs-btn vs-btn--ghost" type="button" data-forgot-back>← Daxil ol</button>
        <div class="vs-alert" data-auth-msg hidden role="status"></div>
      </form>
    </section>
    <section class="vs-auth__col" aria-labelledby="reg-h">
      <h2 class="vs-h2" id="reg-h">Qeydiyyat</h2>
      <form class="vs-auth__form" data-auth="register" novalidate>
        <div class="vs-auth__row"><div class="vs-field"><label for="reg-first">Ad</label><input class="vs-input" id="reg-first" name="reg-first" type="text" autocomplete="given-name" required ><span class="vs-field__msg" data-msg></span></div><div class="vs-field"><label for="reg-last">Soyad</label><input class="vs-input" id="reg-last" name="reg-last" type="text" autocomplete="family-name" required ><span class="vs-field__msg" data-msg></span></div></div>
        <div class="vs-field"><label for="reg-email">E-poçt</label><input class="vs-input" id="reg-email" name="reg-email" type="email" autocomplete="email" required ><span class="vs-field__msg" data-msg></span></div>
        <div class="vs-field"><label for="reg-phone">Telefon</label><input class="vs-input" id="reg-phone" name="reg-phone" type="tel" autocomplete="tel" required pattern="[0-9+ ()\-]{9,}"><span class="vs-field__msg" data-msg></span></div>
        <div class="vs-field"><label for="reg-pass">Şifrə</label><input class="vs-input" id="reg-pass" name="reg-pass" type="password" autocomplete="new-password" required minlength="8"><span class="vs-field__msg" data-msg></span></div>
        <label class="vs-check"><input type="checkbox" name="newsletter">Endirim və kampaniyalardan xəbərdar olmaq istəyirəm</label>
        <button class="vs-btn vs-btn--lg vs-btn--block" type="submit">Qeydiyyatdan keç</button>
        <div class="vs-alert" data-auth-msg hidden role="status"></div>
      </form>
    </section>
  </div>
</main>
<div data-include="partials/footer.html"></div>
<script src="js/i18n.js?v=20261022"></script>
<script src="js/app.js?v=20261022"></script>
<script src="js/pages.js?v=20261022"></script>
<script src="js/pages-info.js?v=20261022"></script>
</body>
</html>
